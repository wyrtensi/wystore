name: Release

# Publishing is driven by a tag, so a release is always tied to a specific commit.
#   git tag v0.1.12 && git push origin v0.1.12
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The keystore is stored as base64 because a secret is text. It is written outside the
      # workspace so a later step cannot accidentally add it to the repository or an artifact.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WYSTORE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "WYSTORE_KEYSTORE_BASE64 is not set; a release cannot be signed." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the signed release
        env:
          WYSTORE_KEYSTORE: ${{ runner.temp }}/release.jks
          WYSTORE_KEYSTORE_PASSWORD: ${{ secrets.WYSTORE_KEYSTORE_PASSWORD }}
          WYSTORE_KEY_ALIAS: ${{ secrets.WYSTORE_KEY_ALIAS }}
          WYSTORE_KEY_PASSWORD: ${{ secrets.WYSTORE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # An unsigned APK would install for nobody and could not update an existing install, so this
      # fails the job rather than publishing something broken.
      - name: Verify the APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Found: $APK"
          case "$APK" in
            *unsigned*) echo "The release APK is unsigned; check the signing secrets." >&2; exit 1 ;;
          esac
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Name the artifact after its version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK_PATH" "wystore-$VERSION.apk"
          echo "RELEASE_APK=wystore-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          generate_release_notes: true
          fail_on_unmatched_files: true
